[package]
name = "libmaxminddb-rs-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Derive macros for libmaxminddb-rs"
repository = "https://github.com/0x00F6/libmaxminddb-rs"
homepage = "https://github.com/0x00F6/libmaxminddb-rs"
documentation = "https://docs.rs/libmaxminddb-rs-derive"
readme = "README.md"
include = ["Cargo.toml", "src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.103"
quote = "1.0.41"
syn = { version = "2.0.108", features = ["full", "extra-traits"] }
