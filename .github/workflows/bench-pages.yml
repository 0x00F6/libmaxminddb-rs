name: Pages benchmark comparison
# Standalone benchmark lockfiles include the reader ArcSwap dependency.
on:
  push:
    branches: [feature/github-pages]
    paths: ['.github/workflows/bench-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            scripts -> target
      - name: Record environment
        run: |
          mkdir -p benchmark-evidence
          git rev-parse HEAD > benchmark-evidence/commit.txt
          date -u --iso-8601=seconds > benchmark-evidence/started.txt
          lscpu --json > benchmark-evidence/lscpu.json
          uname -a > benchmark-evidence/os.txt
          rustc --version --verbose > benchmark-evidence/rustc.txt
          go version > benchmark-evidence/go.txt
          cc --version > benchmark-evidence/cc.txt
          nproc > benchmark-evidence/available-cpus.txt
      - name: Validate benchmark harness
        run: |
          cargo fmt --manifest-path scripts/Cargo.toml -- --check
          cargo test --manifest-path scripts/Cargo.toml
      - name: Run complete cross-library suite
        run: |
          set -o pipefail
          make bench-compare 2>&1 | tee benchmark-evidence/output.log
          date -u --iso-8601=seconds > benchmark-evidence/finished.txt
      - name: Preserve results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison-${{ github.run_id }}
          retention-days: 30
          path: |
            benchmark-evidence/
            target/benchmark-results/
            benchmark-report/
            benchmarks/charts/
            README.md
