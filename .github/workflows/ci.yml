name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features
      - name: Feature isolation
        run: |
          cargo test --no-default-features --features reader
          cargo test --no-default-features --features writer
          cargo run --example concurrent_editor
      - name: Editor million-IP benchmark
        if: github.ref == 'refs/heads/feature/mmdb-editor'
        run: cargo bench --bench editor -- --noplot
      - name: Test documentation
        run: cargo test --doc --all-features
      - name: Build documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features
      - name: Package derive crate
        run: cargo package --manifest-path derive/Cargo.toml
      - name: Package main crate against local derive crate
        run: cargo package --config 'patch.crates-io.libmaxminddb-rs-derive.path="derive"'
