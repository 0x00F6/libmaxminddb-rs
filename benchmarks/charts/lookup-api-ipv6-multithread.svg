<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="100%" height="560" class="lookup-api-chart">
<style>svg { background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }text { fill: #c9d1d9; }.chart-title { fill: #f0f6fc; font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }.chart-subtitle { fill: #8b949e; font-size: 14px; font-weight: 400; }.axis-line { stroke: #30363d; stroke-width: 1.5; }.grid-line { stroke: #21262d; stroke-dasharray: 4,4; stroke-width: 1; }.axis-label { fill: #8b949e; font-size: 13px; }.svg-value { fill: #f0f6fc; font-size: 13px; font-weight: 700; }.legend-text { fill: #c9d1d9; font-size: 13px; font-weight: 600; }.api-series { transition: opacity .12s ease; }.api-series.is-muted { opacity: .14; }.api-series.is-active .api-line { stroke-width: 5; }.api-series.is-active .legend-text { fill: #fff; font-weight: 800; }.api-series.is-active .api-legend-marker { stroke: #fff; stroke-width: 2; }.api-legend { cursor: pointer; outline: none; }.api-legend:focus-visible .legend-text { text-decoration: underline; }.api-hit-area { cursor: pointer; }</style>
